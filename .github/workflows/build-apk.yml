name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Unzip project
        run: unzip -q "SoftWifePet_V0.3_GitHub云编译版.zip" -d project

      - name: Build APK
        run: |
          cd project/SoftWifePet_V0.3_CloudBuild
          gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SoftWifePet-V0.3-debug-apk
          path: project/SoftWifePet_V0.3_CloudBuild/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
